      children:
        - topic: Hệ thống thông gió – yêu cầu gió tươi
          pages: [10, 10]
          raw_text: |-
            e. Hệ thống thông gió:
            Do tòa nhà được thiết kế bao gồm nhiều không gian khác nhau với các chức năng riêng biệt được xác định. Cung cấp tối thiểu lượng thông gió cho các không gian này là rất quan trọng để đạt được chất lượng không khí trong nhà chấp nhận được. Nhu cầu thông gió đôi khi được gọi là gió ngoài trời cấp cho không gian bên trong phù hợp với không gian chức năng, việc dự kiến số lượng người và vật liệu hoàn thiện bên trong nhà.
            TCVN 5687: 2024, Marriott Design Guideline-Luxury Collection khuyến cáo mức độ thông gió tối thiểu để cung cấp cho các không gian chức năng khác nhau nhằm duy trì chất lượng không khí trong nhà ở mức chấp nhận được. Các không gian mà số người không được liệt kê trong Tiêu chuẩn thì sẽ tham khảo theo các không gian liệt kê với chức năng tương đương.
            (Source: Table Appendix F of TCVN 5687-2024 & Marriott Design Guideline)
            Bảng 4.3
