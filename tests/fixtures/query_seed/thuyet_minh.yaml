        - topic: Thông tin mặt dựng – U-value kính, tường, mái
          pages: [11, 11]
          raw_text: |-
            g. Thông tin mặt dựng
            Các thông tin về kiểu cấu trúc, tường, vách ngăn, trần, sàn, mặt dựng và mái từ bản vẽ kiến trúc (các thông số thỏa mãn yêu cầu tối thiểu của QCVN 09-2017/BXD) sẽ được sử dụng kết hợp với hướng của tòa nhà (tiếp giáp hướng đông, hướng tây, hướng bắc, hướng nam…vv) để tính toán tải lạnh vì liên quan đến nhiệt từ bên ngoài truyền vào.
            a. Thông số kính mặt dựng
            U-value : 5.6 W/m²·°K
            SC : 0.4
            b. Tường:
            U-value : 1.8 W/m²·°K
            c. Mái:
