  # ------------------------------------------------------------ 5.7
  - section_key: sec_5_7
    number: "5.7"
    type: SECTION
    vi:
      title: DÂY VÀ CÁP ĐIỆN
      children:
        - topic: Bảo vệ cáp và mối nối
          pages: [21, 21]
          raw_text: |-
            5.7 DÂY VÀ CÁP ĐIỆN
            Trừ trường hợp đặc biệt, cáp phải được bảo vệ trong các phương tiện như khay cáp, thang cáp, ống luồn dây, hộp cáp, rãnh cáp v.v...hoặc chôn dưới đất.
            Không được phép đặt cáp khi chưa lắp xong các phương tiện bảo vệ như ống luồn dây, khay, thang cáp, hộp cáp, rãnh cáp v.v...
            Mối nối cáp hoặc dây điện chỉ được chấp nhận trong các trường hợp sau đây:
            - Điểm nối ở bên trong các thiết bị và khí cụ điện.
            - Điểm nối nằm trên dây tiếp đất đi cùng tuyến cáp. Có thể nối hoặc phân nhánh dây tiếp đất ngay trong khay cáp, thang cáp hoặc hộp cáp.
            - Điểm nối ở bên trong các hộp nối và phụ kiện chuyên dùng thuộc các mạch chiếu sáng, ổ cắm, thông tin, báo cháy v.v...
        - topic: Tuyến cáp và bán kính uốn cong
          pages: [21, 21]
          raw_text: |-
            Cáp từ dưới đất đi lên hoặc luồn qua tường phải đặt trong các đoạn ống luồn cứng và phải thực hiện biện pháp chống thấm, chống ăn mòn và phá hoại cơ học.
            Tuyến cáp phải được lựa chọn sao cho ngắn nhất và phải bảo đảm an toàn không bị hư hỏng về cơ học, do chấn động, bị gỉ, bị nóng quá mức quy định. Cần tránh đặt các dây cáp bắt chéo lên nhau hoặc vắt chéo lên các đường ống dẫn khác.
            Bán kính uốn cong của cáp không thuộc loại cáp mềm phải đủ lớn để không gây hư hỏng cáp và phải tuân theo quy định như sau:
        - topic: Đánh số tuyến cáp và màu dây pha
          pages: [22, 23]
          raw_text: |-
            Tiết diện tối thiểu của ruột dây dẫn và cáp điện:
            Mỗi tuyến cáp phải có số hoặc tên gọi.
            Màu của cáp trong mạng điện xoay chiều 3 pha:
            - Pha A sơn màu vàng;
            - Pha B sơn màu xanh lá cây;
            - Pha C sơn màu đỏ;
            - Dây trung tính sơn trắng cho mạng điện trung tính cách ly và sơn đen cho mạng điện trung tính nối đất trực tiếp.
            - Dây nối đất bảo vệ, nếu được cách điện, phải được đánh dấu bằng một trong hai phương pháp sau:
              - Màu xanh lục/vàng trên suốt chiều dài dây, ngoài ra, đánh dấu bằng màu xanh da trời nhạt ở các đầu nối.
              - Màu xanh da trời nhạt trên suốt chiều dài dây, ngoài ra, đánh dấu bằng màu xanh lục/vàng tại các đầu nối.
        - topic: Tiêu chuẩn và chứng nhận cáp động lực
          pages: [23, 23]
          raw_text: |-
            Các loại cáp điện động lực phải đáp ứng tiêu chuẩn sau:
            - Cáp trung thế (24kV) đáp ứng tiêu chuẩn: IEC 60502-2; TCVN 5935.
            - Cáp hạ thế (450/750 và 600/1000V) đáp ứng tiêu chuẩn: IEC 60502-1; IEC 60227-3; IEC 60332-1.
            Các loại cáp điện động lực phải đạt chứng nhận:
            - Chứng nhận chất lượng của TUV PSB.
            - Chứng nhận chất lượng của Quacert.
        - topic: Lỗ mở, hộp cáp và dự phòng chiều dài
          pages: [23, 23]
          raw_text: |-
            Phải xử lý bề mặt khớp nối của ống luồn dây, khay cáp, thang cáp, hộp cáp v.v...để khi lắp đặt, bảo trì thay thế cáp không bị hư hỏng.
            Các lỗ mở xuyên sàn, tường, đà, vách ngăn cho ống dẫn, khay cáp, thang cáp, hộp cáp phải được trám bằng chất liệu chịu lửa đã được phê duyệt.
            Cho phép đặt nhiều lớp cáp điện trong hộp cáp, nhưng phải ngăn cách mỗi lớp với nhau. Tổng mặt cắt của cáp điện kể cả các lớp bọc cách điện và các lớp vỏ bọc bên ngoài không được lớn hơn 35% tiết diện của hộp cáp.
            Cáp nối với cảm biến nằm ngoài tủ điện phải chứa ít nhất một đoạn 150 mm phục vụ bảo trì.
        - topic: Đi chung cáp và kiểm tra trước lắp đặt
          pages: [24, 24]
          raw_text: |-
            Cáp điện hạ áp không được đi chung với cáp báo cháy hoặc cáp chiếu sáng sự cố trong cùng một ống luồn cáp hoặc máng hộp.
            Cáp lực hạ áp không được đi chung với cáp thông tin, cáp mạng máy tính, cáp tín hiệu trong cùng một ống luồn cáp hoặc hộp cáp trừ khi có vách ngăn bằng vật liệu cách điện có cấp phù hợp đặt giữa cáp hạ áp với các cáp còn lại.
            Cáp có màu vàng và xanh kết hợp chỉ được dùng làm dây tiếp đất thiết bị.
            Trước khi lắp đặt cáp điện phải thực hiện các bước sau:
            a) Thông mạch dây kể cả dây tiếp đất.
            b) Đo điện trở cách điện của cáp.
            c) Điện trở cách điện đo được giữa các lõi cáp với nhau và giữa lõi cáp với đất không được nhỏ hơn 1 MΩ nếu là cáp hạ áp và không được nhỏ hơn 90% giá trị ghi trong biên bản thí nghiệm của nhà chế tạo nếu là cáp trung áp.
            d) Kiểm tra chất lượng các mối nối cáp và chất lượng làm đầu cáp.
    en:
      title: WIRES AND CABLES
      children:
        - topic: Cable protection and connections
          pages: [21, 21]
          raw_text: |-
            5.7 WIRES AND CABLES
            Except in special cases, cables must be protected in cable trays, cable ladders, wire conduit, cable boxes, cable trench etc... or buried underground.
            Not allowed to install the cables when not complete conduit system to protect cable.
            Cable connection are only accepted in the following cases:
            - Inside of equipments
            - Connection of PE cable inside cable tray, cable ladder, trunking.
            - Inside junction box of lighting system, socket outlet system, ELV system, Fire alarm system.…
        - topic: Cable route and bend radius
          pages: [21, 21]
          raw_text: |-
            Cables from underground go up or penetrate through walls need to put in the rigid conduit and waterproof, anti-corrosion and mechanical damage.
            Cable route must be chosen is the shortest and ensure safe from mechanical damage due to vibration, corrosion, overheating. Avoid install the cables cross over each other or crossed over the other pipeline.
            Bend radius of the cable (not flexible cable) must be large enough to not damage the cable and must comply with the following table:
        - topic: Cable route numbering and phase colour code
          pages: [22, 23]
          raw_text: |-
            The minimum cross-sectional area of the conductor and electrical cable:
            Each cable route shall be numbered or named.
            The following colour code shall be used for cable and wire in three pahses electrical network:
            - Cables for A - yellow
            - Cables for B - green
            - Cables for C - red
            - Cable for neutral – white for isolated network, black for earthing direct network
            - Cable for protected earth (PE) if insulated then colour code shall be one of two solutions as follow:
              - Green/yellow on the whole length of cable, in addition marked by light blue at the terminals
              - Light blue on the whole length of cable, in addition marked by green/ yellow at the terminals
        - topic: Power cable standards and certification
          pages: [23, 23]
          raw_text: |-
            Power cables shall comply with the following standards:
            - Medium-voltage cables (24 kV): IEC 60502-2; TCVN 5935.
            - Low-voltage cables (450/750 V and 600/1000 V): IEC 60502-1; IEC 60227-3; IEC 60332-1.
            All Power Cables shall obtain certification as follow:
            - Quality Certificate by TUV PSB.
            - Quality Certificate by Quacert.
        - topic: Openings, trunking and spare length
          pages: [23, 23]
          raw_text: |-
            Treatment the surface of connection of conduit, cable tray, cable ladder, trunking... to the installation, maintenance, replacement cables are not damaged.
            Openings in floors, walls, beams, partition for conduits, cabletray, cable ladder, trunking shall be making good around same with approved fire rated fillings.
            Allow install more layers of cables in the trunking, but shall be separated from each class together. Total cross-section of cables, including cable insulation layer and the outer shell is not greater than 35% cross-section of trunking.
            The cable connect with sensor outside the switchboards shall be addition at least a 150 mm to serves maintenance.
        - topic: Cable segregation and pre-installation tests
          pages: [24, 24]
          raw_text: |-
            Power cables don't install together with cables of fire alarm system or cable of emergency lighting system in the same conduit or cable tray or trunking or cable ladder.
            Power cable shall not install with communication cable, data cable, signal cable in the same conduit or trunking unless use partition with consistent insulating material placed between them.
            Cable with sheath yellow and green combination only be used for equipment ground wire.
            Before install cable must perform the following steps
            a) Measure the continous of the cables and grounding cables
            b) Measure the insulation resistance of the cable,
            c) Insulation resistance is measured between the cable cores and between cores with earth should not be less than 1 MΩ for the low voltage cable and not less than 90% of the value recorded in the minutes of the manufacturer's laboratory if the medium-voltage cables created.
            d) Check quality of cable connections and quality of terminals.

