  # ------------------------------------------------------------ 5.7.1
  - section_key: sec_5_7_1
    parent_section_key: sec_5_7
    number: "5.7.1"
    type: SECTION
    vi:
      title: CÁP CHỐNG CHÁY
      children:
        - topic: Cấu tạo và đặc tính cáp chống cháy
          pages: [26, 26]
          raw_text: |-
            5.7.1 CÁP CHỐNG CHÁY
            Cách thức lắp đặt cáp chống cháy rất quan trọng và cần tuân thủ các nội dung như sau:
            a) Ở cấp điện áp 0,6/1kV.
            b) Cấu tạo:
            - Lõi dẫn điện: Đồng.
            - Băng ngăn cháy.
            - Lớp cách điện: XLPE or FRMI
            - Lớp độn.
            - Vỏ bọc ngoài: LSZH (Low Smoke Zero Halogen).
            c) Cáp chống cháy có đặc điểm sau:
            Cáp được thử ở cháy nhiệt độ 950 0C trong 3 giờ. Cáp được hoạt động bình thường và không bị bất kỳ gián đoạn nào (theo tiêu chuẩn IEC 60754 -1&2 or BS 6387 CWZ và IEC60332-3-22).
            Cáp chống cháy phải đảm bảo yêu cầu PCCC theo TCVN qui định hiện hành.
    en:
      title: FIRE RESISTANT CABLES (FR cable)
      children:
        - topic: FR cable construction and characteristics
          pages: [26, 26]
          raw_text: |-
            5.7.1 FIRE RESISTANT CABLES (FR cable)
            The method of installing fire-resistant cables is very important and must comply with the following contents:
            a) Voltage range 0,6/1KV.
            b) Construction:
            - Conductor: Copper.
            - Fire barriers as mica tape.
            - Insulation: XLPE or FRMI
            - Filler.
            - Outer sheath: Low Smoke Zero Halogen (LSZH).
            c) FR cables have the following characterictics:
            Cables are subjected to fire at 950 0C for 3 hours. Cable shall again be energized, and there shall not be any breakdown (According to IEC 60754 -1&2 or BS 6387 CWZ and IEC60332-3-22)
            Fire-resistant cables must comply with fire protection requirements as specified in the current applicable TCVN standards.

  # ------------------------------------------------------------ 5.23
  - section_key: sec_5_23
    number: "5.23"
    type: SECTION
    vi:
      title: THỜI HẠN BẢO HÀNH
      children:
        - topic: Thời hạn bảo hành 24 tháng
          pages: [48, 49]
          raw_text: |-
            5.23 THỜI HẠN BẢO HÀNH
            Giai đoạn bảo hành 24 tháng bắt đầu từ ngày ghi trong "Chứng nhận nghiệm thu bàn giao".
            Trong suốt thời gian bảo hành 24 tháng, Nhà thầu chịu mọi trách nhiệm (bao gồm cả nhân công và vật tư cần thiết) trong việc khắc phục mọi khiếm khuyết xuất hiện bên ngoài.
            Trường hợp một bộ phận của cụm lắp ráp cần di dời ra khỏi hiện trường để sửa chữa, Nhà thầu phải cung cấp bộ phận hay thiết bị thay thế, và tự thanh toán mọi chi phí liên quan bao gồm phí giao nhận và dỡ tải.
            Theo tinh thần này, việc di dời khỏi hiện trường bao gồm cả hạng mục có hiện tượng gỉ sét, ăn mòn do quá trình bảo vệ không đầy đủ theo nội dung quy định ở trên.
        - topic: Không đáp ứng yêu cầu sửa chữa trong 21 ngày
          pages: [49, 49]
          raw_text: |-
            Trường hợp Nhà thầu không trả lời văn bản yêu cầu sửa chữa các khiếm khuyết trong thời gian bảo hành của Chủ đầu tư hay Nhà tư vấn, trong vòng 21 ngày thì công việc khắc phục sửa chữa sẽ được giao cho Thầu khác thực hiện. Mọi chi phí liên quan sẽ được khấu trừ vào phần tiền giữ lại.
            Nhà thầu sẽ nhận được văn bản thông báo của Chủ đầu tư về vấn đề này vào ngày hết hạn của thời điểm 21 ngày, tính từ ngày Chủ đầu tư gửi thông báo yêu cầu Nhà thầu thực hiện công việc sửa chữa theo các yêu cầu của điều kiện của Hợp đồng.
            Cần lưu ý là mọi khiếm khuết phải được giải quyết trong thời hạn bảo hành.
            Đây không phải là vấn đề bảo dưỡng hay bảo hành.
    en:
      title: DEFECTS LIABILITY PERIOD (WARRANTY)
      children:
        - topic: 24 months defects liability period
          pages: [48, 49]
          raw_text: |-
            5.23 DEFECTS LIABILITY PERIOD (WARRANTY)
            A 24 months Defects Liability Period shall commence from the date of the Taking Over Certificate.
            During this 24 months Defects Liability Period the Contractor shall be fully responsible for the rectification of all defects which becomes apparent.
            Should any part of the installation require to be removed from site for remedial works during this period then the Contractor shall provide replacement parts or equipment and pay for all associated charges including delivering and off loading changes.
            In this sense removal from site shall include those items showing rust or corrosion due to inadequate protection as clearly specified above.
        - topic: Failure to respond within 21 days
          pages: [49, 49]
          raw_text: |-
            Should the Contractor fail to respond to a written request to carry out rectification works within the Defects Liability Period, by either the Client or the Engineer, within 21 days, then the work will be carried out by others and the cost of such remedial works will be deducted from the Retention Sum.
            The Contractor will be formally notified of the Client's intention in this regard at the expiration of 21 days after formal notification to carry out rectification works in accordance with the Contract Conditions.
            It must be clearly understood that the above is all to do with the warranty of the installation.
            It is not a maintenance issue or a service issue.
