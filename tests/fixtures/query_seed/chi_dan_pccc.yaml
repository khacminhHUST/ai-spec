      title: ĐIỀU KIỆN KHÍ HẬU
      children:
        - topic: Điều kiện khí hậu – nhiệt độ ngoài trời tối đa
          pages: [4, 4]
          raw_text: |-
            2. ĐIỀU KIỆN KHÍ HẬU
            Nhà thầu phải thích nghi với điều kiện khí hậu hiện tại ở Việt Nam với nhiệt độ cao bên ngoài có thể lên đến 40o C và độ ẩm cũng tương đối cao.
            Nhà thầu khi đệ trình bản đấu thầu sẽ phải đảm bảo rằng tất cả các vật tư, thiết bị đều phù hợp cho việc sử dụng và vận hành trong các điều kiện khí hậu khác nhau gặp phải.

  - section_key: chap_1__sec_3
    parent_section_key: chap_1
    number: "3"
    type: SECTION
    vi:
      title: TIÊU CHUẨN
      children:
        - topic: Tiêu chuẩn vật tư thiết bị
          pages: [4, 4]
          raw_text: |-
            3. TIÊU CHUẨN
            Tất cả các thông tin chi tiết của vật tư, thiết bị, và tiêu chuẩn cài đặt sẽ phải phù hợp với yêu cầu của tài liệu kỹ thuật và các tiêu chuẩn, quy định hiện hành như mô tả trong các phần khác của tài liệu kỹ thuật.
            Khi các vật tư, thiết bị cung cấp phù hợp với các tiêu chuẩn khác, thì chúng vẫn phải đáp ứng các yêu cầu của tài liệu kỹ thuật này, và bản chi tiết sẽ được cung cấp cho Chủ đầu tư/ hoặc Tổng thầu phê duyệt.
            Nhà thầu có trách nhiệm cung cấp và thực hiện tất cả các kiểm tra cần thiết và phải đảm bảo chất lượng, cũng như tay nghề thi công để phù hợp với yêu cầu kỹ thuật.
        - topic: Quy định lắp đặt hệ thống phun nước và máy bơm
          pages: [4, 5]
          raw_text: |-
            Các Quy Định về thiết kế và lắp đặt hệ thống đèn báo động và phòng cháy chữa cháy:
            a. Việc lắp đặt hệ thống đầu phun nước chống cháy tự động sẽ được cài đặt phù hợp với các tiêu chuẩn hiện hành đã được sửa đổi của Việt Nam hoặc tiêu chuẩn NFPA13 của Mỹ (nếu áp dụng) và thực hiện đúng với yêu cầu của Cơ quan Cảnh sát Phòng Cháy Chữa Cháy và được sự chấp thuận của chính quyền địa phương.
            b. Máy bơm chữa cháy, nguồn điện cấp và hệ thống đường ống liên quan, bể chứa nước, điều khiển điện, đầu ra, nguồn cung cấp nước,… sẽ phải tuân theo các quy định, điều luật của Cơ quan Cảnh sát Phòng Cháy Chữa Cháy, Bộ xây dựng và của tòa nhà.
            d. Hệ thống báo cháy được lắp đặt phù hợp với bộ tiêu chuẩn hiện hành đã sửa đổi của Việt Nam hoặc tiêu chuẩn nước ngoài (nếu áp dụng) và thực hiện theo các quy định và các yêu cầu của Cơ quan Cảnh sát Phòng Cháy Chữa cháy.
