          raw_text: |-
            1. TỔNG QUAN
            Một bộ tài liệu đặc tính kỹ thuật riêng sẽ được ban hành, bao gồm các điều khoản bổ sung áp dụng cho hợp đồng cụ thể. Nếu bất kỳ phần nào của tài liệu kỹ thuật mâu thuẫn với tài liệu kỹ thuật riêng này, thì tài liệu kỹ thuật riêng sẽ được ưu tiên áp dụng.
            Tài liệu kỹ thuật sẽ được đọc cùng với các tài liệu kỹ thuật riêng, bản vẽ, các điều kiện của hợp đồng và tất cả các tài liệu khác liên quan với từng hợp đồng.

  - section_key: chap_1__sec_2
    parent_section_key: chap_1
