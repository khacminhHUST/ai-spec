  # ---------------------------------------------------------------- multi_turn – câu tiếp nối (2)
  - id: h15
    type: multi_turn
    turns:
      - "Thử áp đường ống cấp nước sinh hoạt CT05 yêu cầu thế nào?"
    question: "thế còn ống thoát nước thì sao?"
    max_ok_s: 25
    must_include:
      - ["37.5", "37,5"]
      - ["3 phút", "ba phút", "3 minutes", "three minutes"]
      - ["BS 5572", "BS5572"]
      - ["2 giờ", "2 tiếng", "2 hours", "2h"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Thử hệ thoát nước (PL 2.12 §3.4): chia từng đoạn theo phương ngang, mỗi đoạn 3 tầng; thử kín nước/kín khí bằng không khí, khói hoặc nước theo BS 5572; thử khí giữ 37,5mm cột nước không ít hơn 3 phút không sụt; không đạt thì dùng khói và bọt xà phòng dò mối nối rồi thử lại; ống PP trên sàn: mỗi mối nối thử 3m cột nước ≥ 2 giờ, mối nối chuyển trục đứng (>10m) sang ngang thử 10m cột nước ≥ 2 giờ, giãn nở ≤ 1cm; thử xả bằng bóng nhỏ và kiểm tra bệt xả trôi giấy, mẩu thuốc, que diêm."
    sources:
      - {doc: "Plumbing And Sanitary – 2.12 Testing and commissioning", section: "3.4", page: 5}

  - id: h16
    type: multi_turn
    turns:
      - "Ắc quy của hệ thống báo cháy CT05 phải duy trì hoạt động được bao lâu khi mất điện?"
      - "Còn thang máy thì sao?"
    question: "thế còn đèn chiếu sáng sự cố?"
    max_ok_s: 25
    must_include:
      - ["2 giờ", "2 hours", "2 tiếng", "2h", "hai giờ", "two (2) hours", "hai (2) giờ"]
      - ["3 giờ", "3 hours", "3 tiếng", "3h", "ba giờ"]
      - ["50%"]
      - ["20 giờ", "20 hours", "20 tiếng", "20h", "twenty (20) hours"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Đèn chiếu sáng khẩn cấp có bộ pin riêng Ni-Cd tích hợp, duy trì đèn tối đa (up to) 2 giờ sau khi mất điện, quang thông không dưới 50% so với khi có điện lưới suốt 2 giờ; bộ sạc tự động sạc đầy trong không quá 20 giờ; theo BS 5266, IEC 598-2, TCVN 13456:2022 (EL 4.11 §1). Thuyết minh §2.4.3: đèn khẩn cấp lối thoát hiểm có pin độc lập cho 2 giờ hoạt động, riêng phòng bơm chữa cháy 3 giờ."
    sources:
      - {doc: "EL – 4.11 Emergency Evacuation Lighting", section: "sec_0", page: 1}
      - {doc: "THUYẾT MINH HỒ SƠ THIẾT KẾ THI CÔNG HẠNG MỤC: CƠ ĐIỆN", section: "2.4.3", page: 13}

