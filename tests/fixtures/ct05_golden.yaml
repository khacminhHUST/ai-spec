    sources:
      - {doc: "Fire Protection – 3.08 Sprinkler system", section: "2.1", page: 3}
      - {doc: "Fire Protection – 03. Fire Spec", section: "2.15", page: 58}
      - {doc: "DRC607(CT5)- DD - Spec", section: "7.4.p5", page: 345}

  - id: c09
    type: lookup
    question: "Họng tiếp nước chữa cháy (breeching inlet) ở CT05 lắp ở độ cao bao nhiêu?"
    must_include:
