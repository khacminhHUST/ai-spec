  - id: c11
    type: lookup
    question: "Hệ nước nóng sinh hoạt trung tâm CT05 phải gia nhiệt và hòa trộn ở nhiệt độ bao nhiêu để chống Legionella?"
    must_include:
      - ["60°C", "60 °C", "60oC", "60 o C", "60ºC", "60 độ", "60°"]
      - ["52°C", "52 °C", "52oC", "52 o C", "52ºC", "52 độ", "52°"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Để phòng Legionella, nước được gia nhiệt tới 60°C và hòa trộn sau bể chứa xuống 52°C; độ giảm nhiệt theo chiều dài ống tới thiết bị xa nhất không quá 3°C (PL 2.04 §1.3)."
    sources:
      - {doc: "Plumbing And Sanitary – 2.04 Cold And Hot Water", section: "1.3", page: 2}
      - {doc: "Plumbing And Sanitary – 02. Plumbing And Sanitary Spec", section: "1.3", page: 47}
      - {doc: "DRC607(CT5)- DD - Spec", section: "23.9.p14", page: 206}

  - id: c12
    type: lookup
