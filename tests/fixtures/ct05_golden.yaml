    reference_answer: "Tủ trung thế (MVSB): thảm cao su đen có gân, không đục lỗ, đặt trước và sau tủ, rộng tối thiểu 750mm, dày 12mm, vươn ra ngoài tủ ít nhất 600mm (EL 4.2 §3.4). Tủ hạ thế: thảm cao su dày 6mm, rộng 1m cho toàn bộ chiều dài tủ (EL 4.5 §5.5). Yêu cầu chung: tấm cách điện cao su cứng theo BS 921 phía trước, trên toàn bộ chiều dài bảng điều khiển/tủ trong các phòng điện, phòng máy (EL 4.1 §3.20)."
