      - {doc: "CT5 Tender Design Report", section: "table_1_7", page: 11}

  - id: c14
    type: table
    question: "Đoạn ống nối với bể nước sprinkler ở CT05 có áp lực làm việc và áp lực thử thủy lực tối thiểu bao nhiêu?"
    must_include:
