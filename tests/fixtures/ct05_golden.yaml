    reference_answer: "Bộ giảm âm phù hợp áp suất làm việc 1 kPa; tổn thất áp qua bộ giảm âm không vượt quá 75 Pa (trừ khi bảng thiết bị ghi khác). Vỏ thép mạ kẽm dày ≥1mm, vách đục lỗ ≥0,8mm, chế tạo theo HVCA DW/144 (ACMV 1.08 §1.6)."
    sources:
      - {doc: "ACMV – 1.08 Acoustic Insulation", section: "1.6", page: 4}
      - {doc: "DRC607(CT5)- DD - Spec", section: "23.9.p7", page: 107}

  - id: c08
    type: lookup
    question: "Đầu phun sprinkler CT05 có hệ số K và đường kính lỗ phun bao nhiêu?"
    must_include:
