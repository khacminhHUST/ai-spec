    reference_answer: "Theo bảng áp lực hệ sprinkler: ống nối tới bể chứa sprinkler – áp lực làm việc tối thiểu 6 bar, áp lực thử tối thiểu 9 bar. (Tham chiếu: hệ sprinkler 10/16/15 bar; ống từ họng tiếp nước 8 bar, thử 12 bar.) (FP 3.08 §1.2, bảng)."
    sources:
      - {doc: "Fire Protection – 3.08 Sprinkler system", section: "table_1_2_2", page: 3}
      - {doc: "Fire Protection – 3.08 Sprinkler system", section: "table_1_2_1", page: 3}
      - {doc: "Fire Protection – 03. Fire Spec", section: "table_2_15_7", page: 77}
      - {doc: "DRC607(CT5)- DD - Spec", section: "table_7_4_31", page: 363}

  - id: c15
    type: table
    question: "Tiêu chí thông gió bãi đỗ xe tầng hầm CT05 là bao nhiêu ACH?"
    must_include:
      - ["6 ACH", "6ACH", "6 lần"]
      - ["9 ACH", "9ACH", "9 lần"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Khu đỗ xe: 6 ACH khi bình thường, 9 ACH khi sự cố, áp suất phòng âm (Thuyết minh §3.3.2.2, bảng yêu cầu thông gió)."
    sources:
      - {doc: "THUYẾT MINH HỒ SƠ THIẾT KẾ THI CÔNG HẠNG MỤC: CƠ ĐIỆN", section: "table_3_3_2_2_1", page: 27}
      - {doc: "CT5 Tender Design Report", section: "table_3_2_2", page: 27}

  - id: c16
    type: table
    question: "Theo spec CT05, dây pha 70mm² thì dây tiếp địa bảo vệ đi kèm phải có tiết diện tối thiểu bao nhiêu?"
    must_include:
      - ["35mm2", "35 mm2", "35mm²", "35 mm²", "35 mm 2"]
      - ["S/2", "một nửa", "1/2"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Bảng tiết diện dây bảo vệ theo tiết diện dây pha S: S < 16 → S (và > 4mm² nếu không có bảo vệ cơ khí); 16 < S < 35 → 16mm²; S > 35 → S/2. Dây pha 70mm² → dây tiếp địa bảo vệ 35mm² (EL 4.12 §3.1, bảng)."
    sources:
      - {doc: "EL – 4.12 Earthing System", section: "table_3_1_4", page: 8}
      - {doc: "EL – 4.12 Earthing System", section: "table_3_1_3", page: 8}
      - {doc: "DRC607(CT5)- DD - Spec", section: "table_7_6_5", page: 585}

  # ---------------------------------------------------------------- broad (4)
  - id: c17
    type: broad
    question: "Yêu cầu thử nghiệm hệ thống sprinkler CT05?"
    must_include:
      - ["6 giờ", "6 tiếng", "sáu giờ", "six hours", "6 hours", "6h"]
      - ["15 bar", "15bar"]
      - ["CP 52", "CP52"]
      - ["công tắc lưu lượng", "flow switch", "công tắc áp lực", "pressure switch"]
    must_not_include: []
    expected_status: OK
    reference_answer: "(1) Thử thủy lực trước khi vận hành, từng phần theo chỉ định của Quản lý kỹ thuật: đóng/mở van để cách ly, cách ly công tắc áp lực, dùng bơm tay nâng áp tới áp lực thử và giữ gần như không đổi trong 6 giờ (FP 3.14 §2.3). (2) Áp lực thử tối thiểu hệ sprinkler 15 bar (làm việc 10 bar, ống/phụ kiện 16 bar) (FP 3.08 bảng §1.2). (3) Thử vận hành: kiểm tra áp lực, lưu lượng, sơ đồ điều khiển theo Singapore CP 52 trước khi PCCC nghiệm thu; thử khởi động/dừng bơm bù áp và bơm chính, mở van kiểm tra cuối ống ở điểm thủy lực xa nhất để thử công tắc lưu lượng và công tắc áp lực (FP 3.14 §2.4). (4) Thử công tắc lưu lượng/áp lực của van báo động và tín hiệu trạng thái bơm kết hợp với các thử nghiệm khác (FP 3.14 §3.5)."
    sources:
      - {doc: "Fire Protection – 3.14 Testing and commissioning", section: "2.3", page: 3}
      - {doc: "Fire Protection – 3.14 Testing and commissioning", section: "2.4", page: 4}
      - {doc: "Fire Protection – 3.08 Sprinkler system", section: "table_1_2_2", page: 3}
      - {doc: "Fire Protection – 03. Fire Spec", section: "1.11", page: 118}

  - id: c18
    type: broad
    question: "Quy định lắp đặt ống luồn dây cho hệ thống báo cháy ở CT05?"
    must_include:
      - ["40%"]
      - ["RGS", "thép mạ kẽm"]
      - ["EMT"]
      - ["19mm", "19 mm"]
      - ["7m", "7 m"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Mọi dây báo cháy đi trong ống, mức lấp đầy ≤40% tiết diện trong (khi có ≥3 sợi); không đi chung ống/hộp/máng với dây nguồn; ống ngầm, ngoài trời, phòng máy, tầng hầm dùng ống thép mạ kẽm cứng (RGS), các khu vực khác dùng EMT tối thiểu 19mm; dán nhãn “Báo cháy” (nền đỏ chữ trắng, chữ ≥12mm) cách tối thiểu 7m và tại chỗ xuyên tường; hộp nối, khớp nối, co sơn đỏ trước khi lắp; giá đỡ, móc treo, đai bằng thép mạ kẽm, không gắn vào kết cấu dễ cháy; dây ≥1,5mm² 600V, mạch thông báo dùng cáp chịu lửa 2 giờ (ELV 5.2 §3.2)."
    sources:
      - {doc: "ELV – 5.2 Fire Detection and Alarm", section: "3.2", page: 6}
      - {doc: "DRC607(CT5)- DD - Spec", section: "7.6.p7", page: 648}

  - id: c19
    type: broad
    question: "Yêu cầu thử nghiệm hệ thống thoát nước CT05?"
    must_include:
      - ["37.5", "37,5"]
      - ["3 phút", "ba phút", "3 minutes", "three minutes"]
      - ["BS 5572", "BS5572"]
      - ["2 giờ", "2 tiếng", "2 hours", "2h"]
    must_not_include: []
    expected_status: OK
    reference_answer: "(1) Thử theo từng đoạn chia ngang, mỗi đoạn gồm ống và phụ kiện của 3 tầng; thử kín nước/kín khí bằng không khí, khói hoặc nước theo BS 5572. (2) Thử khí: giữ 37,5mm cột nước không ít hơn 3 phút, không sụt áp; nếu không đạt dùng khói dò rò và thử bọt xà phòng các mối nối, lặp lại tới khi đạt. (3) Ống PP trên sàn: mỗi mối nối thử 3m cột nước ít nhất 2 giờ; mối nối chuyển trục đứng (>10m) sang ngang thử 10m cột nước ít nhất 2 giờ; giãn nở ≤1cm. (4) Thử xả: thả bóng nhỏ chạy thông toàn hệ thống, kiểm tra bệt xả trôi giấy, mẩu thuốc, que diêm (PL 2.12 §3.4)."
    sources:
      - {doc: "Plumbing And Sanitary – 2.12 Testing and commissioning", section: "3.4", page: 5}
      - {doc: "Plumbing And Sanitary – 02. Plumbing And Sanitary Spec", section: "7.4", page: 116}
      - {doc: "DRC607(CT5)- DD - Spec", section: "7.4", page: 279}

  - id: c20
    type: broad
    question: "Chạy thử nghiệm thu máy phát điện CT05 gồm những bước nào?"
    must_include:
      - ["5 phút", "5 minutes"]
      - ["50%"]
      - ["75%"]
      - ["2 giờ", "2 hours", "2 tiếng"]
    must_not_include: []
    expected_status: OK
    reference_answer: "(1) Tuân thủ yêu cầu nhà sản xuất, kiểm tra siết mối nối, thiết bị bảo vệ và giá trị cài đặt cảm biến, kiểm tra chức năng. (2) Khởi động lạnh sau khi động cơ dừng 24 giờ, từ lúc nhận tín hiệu mất điện tới nhận đủ tải danh định theo 3 bước. (3) Chạy liên tục: 5 phút không tải, 1 giờ 50%, 1 giờ 75%, 2 giờ 100% công suất danh định; nhà thầu cấp nhiên liệu và tải giả điện trở, ghi tiêu hao nhiên liệu từng bước. (4) Mỗi 30 phút ghi kW/kVA, điện áp, dòng, tần số, hệ số công suất, áp suất dầu, nhiệt độ nước, sạc ắc quy, độ ồn, nhiệt độ máy. (5) Nộp báo cáo của nhà sản xuất xác nhận tính năng an toàn và điều khiển (EL 4.15 §4.2)."
    sources:
      - {doc: "EL – 4.15 Generator", section: "4.2", page: 16}
      - {doc: "DRC607(CT5)- DD - Spec", section: "7.6.p5", page: 619}

