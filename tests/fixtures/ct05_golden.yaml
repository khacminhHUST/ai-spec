# Bộ câu hỏi kiểm thử DREAM CT05 (dữ liệu production).
# Nguồn dữ liệu: ns `prod` (Postgres schema prod, bảng documents/parent_chunks), export từ prod ngày 2026-11-27,
#   74 tài liệu của project_id DREAM-CT05 (spec EL 4.x, ELV 5.x, ACMV 1.x, Fire Protection 3.x, Plumbing 2.x,
#   Lift 6.1, Thuyết minh thiết kế, CT5 Tender Design Report, quy trình bảo trì…).
# Mọi đáp án đã kiểm chứng bằng cách đọc content_md thật (SQL) của mục ghi trong `sources`.
#
# Cách chạy:
#   python -m tests.eval.run_eval --suite tests/fixtures/ct05_golden.yaml [--ids c01,c04] [--compare old.json]
#
# Quy ước:
# - type: lookup (1 số liệu/yêu cầu) | table (đáp án nằm trong bảng, section_key table_*) | broad (tổng quan,
#   3–6 ý) | multi_source (2+ tài liệu khác nhau/cần gộp) | not_found (không có trong tài liệu CT05).
# - must_include: mỗi phần tử là chuỗi hoặc list cách viết thay thế (khớp 1 là đủ); so khớp không phân biệt
#   hoa thường, bỏ khoảng trắng.
# - must_not_include: số/ý sai không được xuất hiện.
# - sources.doc = documents.title; sources.section = parent_chunks.number (mục) hoặc section_key với bảng
#   (table_*); page = page_start. Tài liệu đầu tiên là nguồn chính (file spec riêng); các file gộp
#   ("DRC607(CT5)- DD - Spec", "Fire Protection – 03. Fire Spec", "Plumbing And Sanitary – 02. …",
#   "CT5 Tender Design Report") chứa cùng nội dung được ghi thêm để chấm trích dẫn.
project: DREAM-CT05
ns: prod
questions:
  # ---------------------------------------------------------------- lookup (12)
  - id: c01
    type: lookup
    question: "Thử cách điện dây dẫn ở CT05 dùng điện áp thử bao nhiêu, điện trở cách điện tối thiểu bao nhiêu?"
    must_include:
      - ["200 mega", "200MΩ", "200 MΩ", "200 megaohm", "200 mêga", "200 Mohm", "200 M ohm"]
      - ["500 V", "500V", "500 Volt", "500VDC"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Dây 220V thử cách điện ở 500V DC; điện trở cách điện giữa dây pha và dây tiếp đất không nhỏ hơn 200 mega-ohm. Thử trước khi cấp điện cho mạch/thiết bị (EL 4.14 §3.1)."
    sources:
      - {doc: "EL – 4.14 Electrical Commissioning", section: "3.1", page: 5}
      - {doc: "DRC607(CT5)- DD - Spec", section: "7.6.p3", page: 593}

  - id: c02
    type: lookup
    question: "Busway CT05 yêu cầu cấp bảo vệ IP bao nhiêu cho lắp trong nhà và ngoài trời?"
    must_include:
      - ["IP54", "IP 54"]
      - ["IP66", "IP 66"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Hệ thống thanh dẫn (busway) cấp bảo vệ IP54 trong nhà và IP66 ngoài trời theo IEC 60529; điện áp định mức 1000V, 3 pha 4 dây (100%N + 50%E), theo IEC 61439-6:2012 hoặc UL857 (EL 4.13 §3.1)."
    sources:
      - {doc: "EL – 4.13 Busway", section: "3.1", page: 2}
      - {doc: "DRC607(CT5)- DD - Spec", section: "7.6.p2", page: 580}

  - id: c03
    type: lookup
    question: "Cáp hạ thế chôn trực tiếp dưới đất ở CT05 phải đặt sâu bao nhiêu?"
    must_include:
      - ["0.9", "0,9", "900"]
      - ["1.3", "1,3", "1300"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Cáp đặt trực tiếp trong đất ở độ sâu 0,9–1,3 m dưới cao độ mặt đường tại mép bó vỉa, trừ vị trí do Nhà quản lý xây dựng chỉ định; phải tuân thủ khoảng cách cáp quy định (EL 4.8 §4.3)."
    sources:
      - {doc: "EL – 4.8 Power Cable and Conductor", section: "4.3", page: 13}
      - {doc: "DRC607(CT5)- DD - Spec", section: "17.6.p9", page: 547}

  - id: c04
    # Đổi lookup → multi_source (2026-11-27): Thuyết minh §2.5.b ghi 24 giờ thường trực + 30 phút khi cháy, ELV 5.2 §3.3
    # ghi 12 giờ + 10 phút báo động → câu trả lời đúng phải nêu cả hai nguồn.
    type: multi_source
    question: "Ắc quy của hệ thống báo cháy CT05 phải duy trì hoạt động được bao lâu khi mất điện?"
    must_include:
      - ["12 giờ", "12h", "12 hours", "12 tiếng"]
      - ["10 phút", "10 minutes", "10 min"]
      - ["24 giờ", "24h", "24 hours", "24 tiếng"]
      - ["30 phút", "30 minutes", "30 min"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Hai tài liệu ghi khác nhau: Spec ELV 5.2 §3.3 – nguồn 24V DC, ắc quy Ni-Cd đủ duy trì hệ thống làm việc bình thường tối thiểu 12 giờ, cuối chu kỳ vẫn cấp cho tải báo động tối đa 10 phút, sạc đầy khoảng 8 giờ; Thuyết minh thiết kế §2.5.b – ắc quy dự phòng của tủ báo cháy đủ hoạt động ít nhất 24 giờ ở chế độ thường trực và 30 phút khi xảy ra cháy."
    sources:
      - {doc: "ELV – 5.2 Fire Detection and Alarm", section: "3.3", page: 9}
      - {doc: "THUYẾT MINH HỒ SƠ THIẾT KẾ THI CÔNG HẠNG MỤC: CƠ ĐIỆN", section: "2.5.b"}
      - {doc: "DRC607(CT5)- DD - Spec", section: "7.6.p7", page: 648}

  - id: c05
    type: lookup
    question: "Khoảng cách tối thiểu giữa cáp động lực và cáp data ở CT05 là bao nhiêu?"
    must_include:
      - ["300mm", "300 mm"]
      - ["600mm", "600 mm"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Tại điểm giao cắt không nhỏ hơn 300mm; chạy song song không nhỏ hơn 600mm, trừ khi có che chắn được chấp thuận; đi cách tối thiểu 1m với nguồn điện từ phổ biến như đèn huỳnh quang (ELV 5.3 §5.1)."
    sources:
      - {doc: "ELV – 5.3 Telephone and Data", section: "5.1", page: 6}
      - {doc: "DRC607(CT5)- DD - Spec", section: "7.6.p8", page: 662}

  - id: c06
    type: lookup
    question: "Thử áp lực đường ống nước lạnh (chilled water) hệ HVAC CT05 yêu cầu thế nào?"
    must_include:
      - ["14 bar", "14bar"]
      - ["24 giờ", "24h", "24 hours", "24 tiếng"]
      - ["1,5 lần", "1.5 lần", "1.5 times", "1,5x", "1.5x", "1,5 x", "1.5 x"]
    must_not_include: []
    expected_status: OK
    reference_answer: "Toàn bộ ống nước thử thủy lực ở 1,5 lần áp suất làm việc tối đa (cột áp tĩnh + cột áp bơm) trong không ít hơn 24 giờ, không rò rỉ, không sụt áp; áp lực thử tối thiểu cho ống nước lạnh và nước nóng là 14 bar (ACMV 1.10 §3.2)."
    sources:
      - {doc: "ACMV – 1.10 Testing and Commissioning", section: "3.2", page: 8}
      - {doc: "DRC607(CT5)- DD - Spec", section: "23.9.p8", page: 120}

  - id: c07
    type: lookup
    question: "Bộ tiêu âm (silencer) ống gió CT05 yêu cầu áp suất làm việc và tổn thất áp tối đa bao nhiêu?"
    must_include:
