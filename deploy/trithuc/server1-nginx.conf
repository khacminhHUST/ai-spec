# ===== Chèn vào /home/ai-trithuc/hawee-deploy/nginx.conf (server 1, container nginx_proxy) =====
# Vị trí: trong khối `server { listen 443 ssl; server_name trithuc.hawee.com.vn; … }`, trước `location /api/ { … }`.
# Thay <IP-S2> bằng IP server 2 (thực tế: 10.34.91.10). client_max_body_size (1024M) và timeout (900s) đã có ở
# mức http – không khai lại. Backend Tri thức nghe http://hawee-backend:6789 (kiểm bằng `nginx -T`).
#
# Đã áp dụng 18/11/2026 (sao lưu: nginx.conf.bak-mep-20261118-1401). Cách làm, không gián đoạn web Tri thức:
#   docker exec nginx_proxy wget -qO- -T 5 http://<IP-S2>:8090/healthz     # phải ra {"ok":true}
#   lưu khối dưới (đã thay IP) vào ~/mep-nginx-snippet.conf, rồi trong ~/hawee-deploy:
#   awk -v snip="$HOME/mep-nginx-snippet.conf" '!done && /^[[:space:]]*location \/api\/ \{/ {
#       while ((getline l < snip) > 0) print l; done=1 } { print }' nginx.conf > /tmp/nginx.conf.mep
#   docker cp /tmp/nginx.conf.mep nginx_proxy:/tmp/ && docker exec nginx_proxy nginx -t -c /tmp/nginx.conf.mep
#   cp -p nginx.conf nginx.conf.bak-mep-$(date +%Y%m%d-%H%M)
#   cat /tmp/nginx.conf.mep > nginx.conf      # ghi ĐÈ NỘI DUNG: file bind-mount 1 file, cp/mv tạo inode mới → container
#                                             # vẫn đọc bản cũ
#   docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
# Kiểm: curl -sk --resolve trithuc.hawee.com.vn:443:127.0.0.1 https://trithuc.hawee.com.vn/thongtinduan/api/projects → 401
# Gỡ: cat nginx.conf.bak-mep-… > nginx.conf && docker exec nginx_proxy nginx -s reload

        # ----- App MEP Project Assistant (server 2) -----
        # Kiểm đăng nhập: hỏi backend Tri thức (get_current_user: chỉ access token, đọc DB, tài khoản đã xóa → 401).
        location = /_mep_auth {
            internal;
            proxy_pass http://hawee-backend:6789/api/auth/phien;
            proxy_method GET;                 # request phụ giữ method gốc (POST /chat…) – /auth/phien chỉ nhận GET
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
        }

        # Callback OAuth của nguồn MCP: trình duyệt bị chuyển hướng về, không có Bearer → không qua _mep_auth
        # (backend MEP tự kiểm tham số state + cookie).
        location = /thongtinduan/api/mcp/oauth/callback {
            proxy_pass http://<IP-S2>:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API MEP: bắt buộc đăng nhập web Tri thức.
        location ^~ /thongtinduan/api/ {
            auth_request /_mep_auth;
            proxy_pass http://<IP-S2>:8090;          # không có "/" cuối: giữ nguyên đường dẫn /thongtinduan/…
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;                     # chat trả về dạng SSE
        }

        # Giao diện MEP (file tĩnh, không chứa dữ liệu) – không cần đăng nhập.
        location ^~ /thongtinduan {
            proxy_pass http://<IP-S2>:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # ----- hết App MEP -----
#
# (Tùy chọn, khi backend Tri thức bị tải nhiều) Mỗi request API của MEP sinh 1 lần kiểm token ở hawee-backend
# (trang hàng chờ tự làm mới 3 giây/lần). Có thể nhớ kết quả kiểm 30 giây theo token:
#   - thêm ở mức http { … }:   proxy_cache_path /var/cache/nginx/mep_auth keys_zone=mep_auth:1m max_size=10m;
#   - thêm trong location = /_mep_auth:
#         proxy_cache mep_auth;  proxy_cache_key $http_authorization;  proxy_cache_valid 200 30s;
#   Đánh đổi: đăng xuất / khóa tài khoản có hiệu lực với app MEP chậm tối đa 30 giây.
