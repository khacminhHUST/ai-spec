# Cấu hình model embedding theo ngôn ngữ.
# Bắt buộc: ingest và query dùng CÙNG model cho cùng ngôn ngữ. Đổi model => embed lại toàn bộ collection đó.
# Giai đoạn hiện tại: dùng API có sẵn, chưa self-host. Self-host / fine-tune: dự án chọn embedding riêng (sau).

embedding:
  vi:
    # 2026-10-28: chuyển sang Gemini (DeepInfra cần nạp tiền). Quay lại Qwen3 → khôi phục khối dưới + migrate --recreate + ingest --force.
    #   model: Qwen/Qwen3-Embedding-8B · provider: deepinfra · dimensions: 4096 · max_input_tokens: 32000
    #   query_instruction: "Instruct: Given a question from an MEP engineer, retrieve relevant passages from project documents\nQuery: "
    model: gemini-embedding-2
    provider: google
    dimensions: 3072
    max_input_tokens: 8192
    task_type_document: RETRIEVAL_DOCUMENT
    task_type_query: RETRIEVAL_QUERY
    collection: child_chunks_vi
  en:
    model: gemini-embedding-2   # GA 04/2026; nếu ListModels chưa có thì dùng gemini-embedding-2-preview
    provider: google            # Gemini API; key: GOOGLE_API_KEY
    dimensions: 3072            # đã kiểm tra 2026-10-28
    max_input_tokens: 8192      # đã kiểm tra ListModels 2026-10-28 (inputTokenLimit)
    task_type_document: RETRIEVAL_DOCUMENT
    task_type_query: RETRIEVAL_QUERY
    collection: child_chunks_en

# Tokenizer đếm token (ngưỡng chunk / ngân sách context). Gemini không có tokenizer offline → BPE Qwen3 làm xấp xỉ.
# Đổi tokenizer => số token đổi => phải chunk lại.
token_counter:
  hf_tokenizer: Qwen/Qwen3-Embedding-8B

sparse:
  method: bm25              # Qdrant BM25 cho cả vi và en (Qwen3/Gemini không có sparse)
  keep_tokens_regex: config/keyword_patterns.yaml  # giữ nguyên mã kỹ thuật: DN65, 1.5mm2, 5.7.1, TCVN 5687:2024...

# Ứng viên đánh giá ở dự án chọn embedding:
#   Qwen3-Embedding-8B, gemini-embedding-001, Cohere embed-v4, AITeamVN/Vietnamese_Embedding, bge-m3 (baseline)

# LLM dùng cho chunking ở Ingestion (chỉ trả vị trí cắt)
chunking_llm:
  provider: google_genai
  model: gemini-3.5-flash-lite
  temperature: 0
