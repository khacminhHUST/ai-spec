# MCP server cho Agent Harness (docs/agent-harness.md mục 3, 6) – nạp qua langchain-mcp-adapters.
# access: read (agent tự gọi) | write (ghi/đẩy dữ liệu ra ngoài → cần người dùng xác nhận).
# Thứ tự: tools.<tên>.access > access của server > mặc định write.
# Secret lấy từ .env: viết ${TEN_BIEN} trong url/headers/env/args.
#
# Ví dụ:
# servers:
#   trimble:
#     transport: streamable_http          # stdio | sse | streamable_http | websocket
#     url: https://mcp.example.com/mcp
#     headers: {Authorization: "Bearer ${TRIMBLE_TOKEN}"}
#     access: read
#     tools:
#       create_issue: {access: write}
#   local_tool:
#     transport: stdio
#     command: python
#     args: [path/to/server.py]
servers: {}
tool_name_prefix: true      # tên tool = <server>_<tool>, tránh trùng

# ---- Connector khai qua giao diện (docs/mcp-connectors.md) – lưu DB, không khai ở đây ----
# Server ở trên (servers) vẫn chạy như cũ, hiển thị ở tab "Kết nối" chế độ chỉ đọc.
# Secret: MEP_SECRET_KEY trong .env (mã hóa token OAuth, header tĩnh). Thiếu → OAuth/header báo lỗi, `none` vẫn chạy.
public_base_url: http://localhost:5173   # origin frontend; redirect_uri = <public_base_url>/mcp/oauth/callback
client_name: MEP Project Assistant       # tên client khi đăng ký động (DCR) với Authorization Server
tool_cache_ttl_s: 600                    # cache tools/list theo (connector, user)
refresh_skew_s: 60                       # access token còn dưới ngưỡng này → refresh trước khi gọi
http_timeout_s: 20                       # timeout gọi MCP server / Authorization Server
allow_http_localhost: true               # cho phép http://localhost | 127.0.0.1 (dev); còn lại bắt buộc https
state_ttl_s: 600                         # state OAuth sống 10 phút, dùng 1 lần
